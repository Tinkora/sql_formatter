name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run tests
        run: cargo test
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Check WASM compilation
        run: |
          cargo check -p sql_formatter_core --target wasm32-unknown-unknown
          cargo check -p sql_formatter_web --target wasm32-unknown-unknown

  build-web:
    runs-on: ubuntu-latest
    needs: [test, wasm]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build web WASM
        run: wasm-pack build --target web crates/sql_formatter_web
